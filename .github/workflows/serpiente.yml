# Genera la serpiente de contribuciones (roja sobre verde) y la publica en la rama "output"
name: serpiente

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/serpiente-light.svg?palette=github-light&color_snake=#dc2626&color_dots=#dcfce7,#86efac,#22c55e,#15803d,#052e16
            dist/serpiente-dark.svg?palette=github-dark&color_snake=#f87171&color_dots=#06200f,#14532d,#15803d,#22c55e,#86efac

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
